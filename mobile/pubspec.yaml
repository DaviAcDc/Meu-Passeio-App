name: centro_historico_slz
description: App do Centro Histórico de São Luís - mapa, marketplace gastronômico e guia/comunidade.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"   # Flutter 3.22 ou mais novo (usa WidgetState)

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
